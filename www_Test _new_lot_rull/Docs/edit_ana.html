<body>
<p>1. 建立/修改依賴：
</p>
<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;可由舊的Ver3.66 barcode 修改‧</p>
<p><img src="未命名.png" width="1013" height="560" alt="edit_ana" longdesc="未命名.png" /></p>
<p>如圖：如果是修改依賴，請依照順序填寫修改分析項目‧如果是新增，必須填選品名‧</p>
<p>也可由新的barcode 新增:</p>
<p>選擇分析作業-分析依賴查詢畫面及結果-修改依賴</p>
<p><img src="web_edit_ana.jpg" width="1271" height="430" alt="web" /></p>
<p>填寫要修改的Lot No，再點選取得資料‧</p>
<p><img src="web_edit_ana1.gif" width="1062" height="466" alt="3" /></p>
<p>資料列出之後點選&quot;新增/修改分析項目&quot;</p>
<p><img src="web_edit_ana_items.gif" width="1103" height="504" /></p>
<p>進入修改分析項目頁面：這裡只會列出產品相關的測試選項，不屬於此項產品的分析方法不會列出來‧</p>
<p>最下方為TM選項，勾選之後點選 &quot;確定/離開&quot;</p>
<p><img src="web_edit_ana_items2.gif" width="825" height="433" /></p>
<p>&nbsp;</p>
<p>回到上一個頁面，點選 &quot;修改完成/送出&quot;， 即可完成分析項目修改‧</p>
<p><img src="web_edit_ana_items3.gif" width="1043" height="534" /></p>
<p>&nbsp;</p>
</body>
</html>
